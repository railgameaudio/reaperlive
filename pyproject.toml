[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reaperlive"
version = "0.1.0"
description = "Turn a YouTube link or audio file into a tempo-mapped REAPER (or Ableton) project with separated stems, a metronome track and section markers."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "librosa>=0.10",
    "soundfile>=0.12",
    "yt-dlp>=2024.1.1",
]

[project.optional-dependencies]
# Meta's Demucs (Hybrid Transformer Demucs) - default separator.
demucs = ["demucs>=4.0.1", "torch>=2.0"]
# Mel-Band RoFormer / MDX-Net models, usually the strongest vocal separation.
roformer = ["audio-separator[cpu]>=0.17"]
dev = ["pytest>=7"]

[project.scripts]
reaperlive = "reaperlive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
